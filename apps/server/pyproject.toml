[project]
name = "duanju-server"
version = "0.1.0"
description = "AI short-drama director workbench backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "anthropic>=2.1.0",
    "httpx>=0.28.1",
    "scenedetect>=0.7.2",
    "faster-whisper>=1.2.1",
    "av>=11,<17",  # faster-whisper 1.2 calls av.open(metadata_errors=...), removed in av 17+
    "celery>=5.6.3",
    "redis>=8.1.0",
    "opentimelineio>=0.18.1",
    "python-multipart>=0.0.32",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
